<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARÈS-7 — agglomération (coques f2 réelles)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#060608; color:#d8d8d2; font-family:system-ui,-apple-system,sans-serif; overflow:hidden; }
  #wrap { display:flex; flex-direction:column; height:100vh; }
  #bar { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid #1d1d22; flex-wrap:wrap; }
  #bar h1 { font-size:14px; font-weight:500; margin-right:6px; letter-spacing:.4px; }
  #bar h1 span { color:#7a7a82; font-weight:400; font-size:12px; }
  button { background:#141418; color:#cfcfca; border:1px solid #2a2a31; padding:6px 12px; border-radius:7px; font-size:12px; cursor:pointer; transition:.15s; }
  button:hover { background:#1d1d23; }
  button.on { background:#2a2a33; border-color:#4a4a55; color:#fff; }
  #stage { position:relative; flex:1; min-height:0; }
  canvas { display:block; }
  .ov { position:absolute; pointer-events:none; }
  #info { left:14px; top:14px; background:rgba(10,10,14,.78); border:1px solid #22222a; border-radius:9px; padding:10px 12px; max-width:300px; font-size:11.5px; line-height:1.55; }
  #info .big { font-size:22px; font-weight:600; color:#bfe0ff; letter-spacing:.5px; }
  #info b { color:#fff; } #info .t { color:#9a9aa2; } #info .warn { color:#ffae6a; }
  #hint { right:14px; bottom:14px; color:#5a5a62; font-size:11.5px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <h1>ARÈS-7 <span>— agglomération · coques géodésiques f2 · Ø12 m · empilement icosaédrique</span></h1>
    <button id="b1" class="on">13 (≈10)</button>
    <button id="b2">55 (≈50)</button>
    <button id="b3">147 (≈100)</button>
    <button id="b6">923 (≈1000)</button>
    <button id="bInt" class="on">arêtes internes: ON</button>
  </div>
  <div id="stage">
    <div id="info" class="ov"></div>
    <div id="hint" class="ov">glisser pour tourner · molette pour zoomer</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const stage=document.getElementById('stage');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,1,0.1,4000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
stage.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x3a3a44,1.0));
const key=new THREE.DirectionalLight(0xffffff,0.85); key.position.set(4,6,5); scene.add(key);
const rim=new THREE.DirectionalLight(0x5577ff,0.35); rim.position.set(-5,-3,-4); scene.add(rim);
const root=new THREE.Group(); root.rotation.x=0.35; scene.add(root);

const t=(1+Math.sqrt(5))/2;
const norm=v=>{const l=Math.hypot(v[0],v[1],v[2]);return[v[0]/l,v[1]/l,v[2]/l];};

// ---- coque f2 (identique au viewer canonique) ----
function buildF2(){
  const ico=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(norm);
  const F=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  const verts=ico.slice(); const cache={};
  const mid=(a,b)=>{const k=a<b?a+'_'+b:b+'_'+a;if(cache[k]!=null)return cache[k];const va=verts[a],vb=verts[b];const m=norm([(va[0]+vb[0])/2,(va[1]+vb[1])/2,(va[2]+vb[2])/2]);const i=verts.length;verts.push(m);cache[k]=i;return i;};
  const eset={}; const ae=(a,b)=>{const k=a<b?a+'_'+b:b+'_'+a;eset[k]=[a,b];};
  const faces=[];
  for(const [a,b,c] of F){const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);
    faces.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]);
    ae(a,ab);ae(ab,b);ae(b,bc);ae(bc,c);ae(c,ca);ae(ca,a);ae(ab,bc);ae(bc,ca);ae(ca,ab);}
  return {verts,edges:Object.values(eset),faces,orig:12};
}
const G=buildF2();
const isOrig=i=>i<G.orig;
const radialE=G.edges.filter(([a,b])=>isOrig(a)!==isOrig(b));
const interiorE=G.edges.filter(([a,b])=>!isOrig(a)&&!isOrig(b));
const baseV=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(norm);
const ICOF=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
const IES={}; ICOF.forEach(f=>{for(let i=0;i<3;i++){let a=f[i],b=f[(i+1)%3];let k=a<b?a+'_'+b:b+'_'+a;IES[k]=[Math.min(a,b),Math.max(a,b)];}});
const ICOE=Object.values(IES);

// ---- positions Mackay (centres des modules) ----
function mackayShell(k){
  if(k===0)return[[0,0,0]];
  const p=[];
  for(const v of baseV) p.push([v[0]*k,v[1]*k,v[2]*k]);
  for(const [a,b] of ICOE){const va=baseV[a],vb=baseV[b];
    for(let j=1;j<k;j++){const f=j/k;p.push([(va[0]*(1-f)+vb[0]*f)*k,(va[1]*(1-f)+vb[1]*f)*k,(va[2]*(1-f)+vb[2]*f)*k]);}}
  for(const [a,b,c] of ICOF){const va=baseV[a],vb=baseV[b],vc=baseV[c];
    for(let i=1;i<k;i++)for(let j=1;j<k-i;j++){const u=i/k,w=j/k,z=1-u-w;
      p.push([(va[0]*z+vb[0]*u+vc[0]*w)*k,(va[1]*z+vb[1]*u+vc[1]*w)*k,(va[2]*z+vb[2]*u+vc[2]*w)*k]);}}
  return p;
}
function allCenters(n){let c=[];for(let k=0;k<=n;k++)c=c.concat(mackayShell(k));return c;}

// ---- montage fusionné ----
const R=0.49; // rayon coque : modules se touchent (espacement Mackay ≈ 1)
let showInt=true, current=1;
function build(n){
  while(root.children.length) root.remove(root.children[0]);
  const centers=allCenters(n);
  // faces (noir mat) fusionnées
  const fp=[];
  for(const c of centers) for(const f of G.faces) for(const idx of f){const v=G.verts[idx];fp.push(c[0]+v[0]*R,c[1]+v[1]*R,c[2]+v[2]*R);}
  const fg=new THREE.BufferGeometry(); fg.setAttribute('position',new THREE.Float32BufferAttribute(fp,3)); fg.computeVertexNormals();
  root.add(new THREE.Mesh(fg,new THREE.MeshStandardMaterial({color:0x0d0d11,roughness:1,metalness:0,side:THREE.DoubleSide,flatShading:true})));
  // arêtes radiales (blanches)
  const seg=(edges)=>{const pos=[];for(const c of centers)for(const [a,b] of edges){const va=G.verts[a],vb=G.verts[b];pos.push(c[0]+va[0]*R,c[1]+va[1]*R,c[2]+va[2]*R,c[0]+vb[0]*R,c[1]+vb[1]*R,c[2]+vb[2]*R);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));return g;};
  root.add(new THREE.LineSegments(seg(radialE),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending})));
  if(showInt) root.add(new THREE.LineSegments(seg(interiorE),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending})));
  fitR=n+1.0; fitCamera(fitR);
  const total=centers.length, diam=(2*n)*12+12, mass=total*150;
  document.getElementById('info').innerHTML=
   `<div class="big">${total} coques f2</div>
    <div class="t">${n} couche(s) complète(s) · nombre magique</div>
    <div style="margin-top:7px"><b>~${diam} m</b> de travers · <b>~${mass.toLocaleString('fr')} t</b></div>
    <div class="t" style="margin-top:6px">chaque module = coque 42/120/80 · 12 nœuds φ = 12 contacts possibles</div>    <div class="warn" style="margin-top:6px">les coques quasi-sphériques laissent ~26 % de vide · pôles réacteur/habitat non orientés ici</div>`;
}

let fitR=4;
function fitCamera(needed){const v=camera.fov*Math.PI/180;const h=2*Math.atan(Math.tan(v/2)*camera.aspect);const dz=Math.max(needed/Math.sin(v/2),needed/Math.sin(h/2));camera.position.set(0,0,dz*1.08);camera.lookAt(0,0,0);}
let drag=false,px=0,py=0,autoR=true;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;autoR=false;px=e.clientX;py=e.clientY;});
window.addEventListener('pointerup',()=>drag=false);
window.addEventListener('pointermove',e=>{if(!drag)return;root.rotation.y+=(e.clientX-px)/180;root.rotation.x+=(e.clientY-py)/180;px=e.clientX;py=e.clientY;});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();camera.position.z=Math.max(fitR*0.5,Math.min(fitR*5,camera.position.z+e.deltaY*0.004*fitR));},{passive:false});
const btns={b1:1,b2:2,b3:3,b6:6};
for(const id in btns){document.getElementById(id).onclick=function(){for(const o in btns)document.getElementById(o).classList.remove('on');this.classList.add('on');current=btns[id];build(current);};}
document.getElementById('bInt').onclick=function(){showInt=!showInt;this.textContent='arêtes internes: '+(showInt?'ON':'OFF');this.classList.toggle('on',showInt);build(current);};
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();fitCamera(fitR);}
window.addEventListener('resize',resize);
function loop(){requestAnimationFrame(loop);if(autoR)root.rotation.y+=0.003;renderer.render(scene,camera);}
resize(); build(1); loop();
</script>
</body>
</html>
